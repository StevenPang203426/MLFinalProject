# 基线实验配置文件

# 模型配置
model:
  name: "../models/qwen2-1.5b"  # 本地模型路径（相对于项目根目录）
  # 或者使用绝对路径: "C:/Users/lenovo/Desktop/PDML/models/qwen2-1.5b"
  cache_dir: "./cache"
  
# 数据配置
data:
  train_path: "./data/train_converted.jsonl"  # 使用转换后的数据
  val_path: "./data/valid_converted.jsonl"     # 使用转换后的数据
  test_path: "./data/test_converted.jsonl"    # 使用转换后的数据
  task_type: "summarization"  # summarization, math, dialogue

# 训练配置
training:
  output_dir: "./results/baseline"
  num_epochs: 3
  batch_size: 128
  mini_batch_size: 128
  gradient_accumulation_steps: 1
  learning_rate: 1.41e-5
  warmup_steps: 100
  save_steps: 500
  eval_steps: 500
  logging_steps: 100
  seed: 42

# PPO 配置
ppo:
  ppo_epochs: 4
  target_kl: 0.1
  init_kl_coef: 0.2
  adap_kl_ctrl: true
  cliprange: 0.2
  cliprange_value: 0.2
  gamma: 1.0
  lam: 0.95

# 奖励模型配置
reward_model:
  name: "base_reward_model"
  # 其他奖励模型参数

# 评估配置
evaluation:
  metrics: ["rouge", "bleu", "accuracy"]
  num_samples: 100

# wandb 配置
wandb:
  enabled: true
  project: "rl-reward-design"
  name: "baseline"
  tags: ["baseline", "rlhf"]
