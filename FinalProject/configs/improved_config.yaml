# 改进实验配置文件

# 模型配置
model:
  name: "Qwen/Qwen-1_8B"
  cache_dir: "./cache"
  
# 数据配置
data:
  train_path: "./data/train.jsonl"
  val_path: "./data/val.jsonl"
  test_path: "./data/test.jsonl"
  task_type: "summarization"  # summarization, math, dialogue

# 训练配置
training:
  output_dir: "./results/improved"
  num_epochs: 3
  batch_size: 128
  mini_batch_size: 128
  gradient_accumulation_steps: 1
  learning_rate: 1.41e-5
  warmup_steps: 100
  save_steps: 500
  eval_steps: 500
  logging_steps: 100
  seed: 42

# PPO 配置
ppo:
  ppo_epochs: 4
  target_kl: 0.1
  init_kl_coef: 0.2
  adap_kl_ctrl: true
  cliprange: 0.2
  cliprange_value: 0.2
  gamma: 1.0
  lam: 0.95

# 改进的奖励模型配置
reward_model:
  type: "regularized"  # regularized, shaped, multi_reward, verifier
  
  # 正则化奖励配置
  regularized:
    length_penalty_weight: 0.1
    repetition_penalty_weight: 0.1
    min_length: 10
    max_length: 100
  
  # 奖励塑形配置
  shaped:
    final_reward_weight: 0.7
    relevance_weight: 0.2
    conciseness_weight: 0.1
  
  # 多奖励配置
  multi_reward:
    rewards:
      - name: "accuracy"
        weight: 0.6
      - name: "conciseness"
        weight: 0.4
    normalization: "min_max"  # min_max, z_score, none

# 评估配置
evaluation:
  metrics: ["rouge", "bleu", "accuracy", "diversity"]
  num_samples: 100

# wandb 配置
wandb:
  enabled: true
  project: "rl-reward-design"
  name: "improved"
  tags: ["improved", "reward_design"]
